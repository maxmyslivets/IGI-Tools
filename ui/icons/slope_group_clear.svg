<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- IGI_SLOPE_GROUP_CLEAR: объекты группы с крестом (удаление XData) -->
  <defs>
    <style>
      .line { stroke: #2c3e50; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .dash { stroke: #2c3e50; stroke-width: 1.0; fill: none; stroke-dasharray: 2,2; stroke-linecap: round; }
      .cross { stroke: #e74c3c; stroke-width: 1.8; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Верхний контур -->
  <polyline class="line" points="5,7 13,5 21,9 28,6"/>

  <!-- Нижний контур -->
  <polyline class="line" points="6,23 14,21 22,25 28,22"/>

  <!-- Штрихи -->
  <line class="dash" x1="8"  y1="9"  x2="9"  y2="21"/>
  <line class="dash" x1="15" y1="7"  x2="16" y2="20"/>
  <line class="dash" x1="23" y1="10" x2="24" y2="24"/>

  <!-- Красный крест (удаление/очистка) -->
  <line class="cross" x1="23" y1="14" x2="29" y2="20"/>
  <line class="cross" x1="29" y1="14" x2="23" y2="20"/>
</svg>