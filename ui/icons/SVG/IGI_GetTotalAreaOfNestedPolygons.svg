<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background Grid Alignment Anchor (Transparent) -->
  <rect width="32" height="32" fill="none"/>

  <!-- БАЗОВЫЙ СЛОЙ: Вложенные полигоны -->

  <!-- Внешний полигон (граница) — сдвинут влево -->
  <polygon points="2,24 6,5 18,4 22,12 20,20 4,26" fill="#D9D9D9" stroke="#666666" stroke-width="1" stroke-linejoin="round"/>

  <!-- Внутренний полигон (вложенный) — сдвинут влево -->
  <polygon points="8,17 12,10 18,11 17,18 10,20" fill="#D9D9D9" fill-opacity="0.65" stroke="#666666" stroke-width="1" stroke-linejoin="round"/>

  <!-- МОДИФИКАТОР: Исправленная Сигма Σ (сумма) — классические пропорции -->
  <path d="M 29,9 H 22 V 10 L 25.5,16 L 22,22 V 23 H 29" fill="none" stroke="#89CBFA" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter"/>
</svg>
