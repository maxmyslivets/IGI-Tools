<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Фоновая линия (геометрия) — скрыта маской, пунктир -->
  <line x1="2" y1="16" x2="30" y2="16" stroke="#666666" stroke-width="2" stroke-dasharray="2,2"/>
  <line x1="4" y1="10" x2="28" y2="10" stroke="#808080" stroke-width="1.5" stroke-dasharray="2,3"/>
  <line x1="4" y1="22" x2="28" y2="22" stroke="#808080" stroke-width="1.5" stroke-dasharray="2,3"/>

  <!-- Тело маски (сплошная — активна) -->
  <rect x="6" y="6" width="20" height="20" rx="3" fill="#D9D9D9" fill-opacity="0.7" stroke="#666666" stroke-width="1"/>

  <!-- Штриховка маски (диагональные линии) -->
  <line x1="7" y1="11" x2="11" y2="7" stroke="#808080" stroke-width="0.6"/>
  <line x1="11" y1="11" x2="15" y2="7" stroke="#808080" stroke-width="0.6"/>
  <line x1="15" y1="11" x2="19" y2="7" stroke="#808080" stroke-width="0.6"/>
  <line x1="19" y1="11" x2="23" y2="7" stroke="#808080" stroke-width="0.6"/>
  <line x1="23" y1="11" x2="25" y2="9" stroke="#808080" stroke-width="0.6"/>

  <line x1="7" y1="15" x2="11" y2="11" stroke="#808080" stroke-width="0.6"/>
  <line x1="11" y1="15" x2="15" y2="11" stroke="#808080" stroke-width="0.6"/>
  <line x1="15" y1="15" x2="19" y2="11" stroke="#808080" stroke-width="0.6"/>
  <line x1="19" y1="15" x2="23" y2="11" stroke="#808080" stroke-width="0.6"/>
  <line x1="23" y1="15" x2="25" y2="13" stroke="#808080" stroke-width="0.6"/>

  <line x1="7" y1="19" x2="11" y2="15" stroke="#808080" stroke-width="0.6"/>
  <line x1="11" y1="19" x2="15" y2="15" stroke="#808080" stroke-width="0.6"/>
  <line x1="15" y1="19" x2="19" y2="15" stroke="#808080" stroke-width="0.6"/>
  <line x1="19" y1="19" x2="23" y2="15" stroke="#808080" stroke-width="0.6"/>
  <line x1="23" y1="19" x2="25" y2="17" stroke="#808080" stroke-width="0.6"/>

  <line x1="7" y1="23" x2="11" y2="19" stroke="#808080" stroke-width="0.6"/>
  <line x1="11" y1="23" x2="15" y2="19" stroke="#808080" stroke-width="0.6"/>
  <line x1="15" y1="23" x2="19" y2="19" stroke="#808080" stroke-width="0.6"/>
  <line x1="19" y1="23" x2="23" y2="19" stroke="#808080" stroke-width="0.6"/>

  <line x1="7" y1="25" x2="9" y2="23" stroke="#808080" stroke-width="0.6"/>

  <!-- Красный крест (отключение) -->
  <line x1="10" y1="10" x2="22" y2="22" stroke="#FF6666" stroke-width="3" stroke-linecap="round"/>
  <line x1="22" y1="10" x2="10" y2="22" stroke="#FF6666" stroke-width="3" stroke-linecap="round"/>
</svg>