<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">

  <g stroke="#666666" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">

    <!-- ТРЕТЬЯ ФИГУРА (Задний план, справа) -->
    <!-- Идеальная каплевидная форма с острым верхом и круглым основанием -->
    <path d="M 68,14
             C 74,25 84,40 81,54
             C 78,65 67,69 57,66
             C 47,63 47,48 55,34
             Z" fill="#D9D9D9" />

    <!-- ВТОРАЯ ФИГУРА (Средний план, центр) -->
    <!-- Повторяет форму, смещаясь чуть левее и ниже -->
    <path d="M 51,11
             C 58,23 71,38 67,52
             C 63,64 51,68 41,64
             C 32,60 33,45 40,31
             Z" fill="#D9D9D9" />

    <!-- ПЕРВАЯ ФИГУРА (Передний план, доминирующая слева) -->
    <!-- Полностью перекрывает задние элементы благодаря заливке цветом фона -->
    <path d="M 33,14
             C 41,27 57,41 51,57
             C 46,70 30,71 22,63
             C 14,55 17,39 24,27
             Z" fill="#D9D9D9" />

    <!-- ТРИ СВЯЗУЮЩИЕ ЛИНИИ (СТВОЛ) -->
    <!-- Направлены строго из нижних точек фигур к вершине круглого маркера -->
    <line x1="43" y1="65" x2="50" y2="78" fill="none" />
    <line x1="50" y1="66" x2="50" y2="78" fill="none" />
    <line x1="57" y1="65" x2="50" y2="78" fill="none" />

    <!-- НИЖНИЙ КРУГЛЫЙ МАРКЕР -->
    <circle cx="50" cy="85" r="7" fill="#D9D9D9" />

  </g>
</svg>
