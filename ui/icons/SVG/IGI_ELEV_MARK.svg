<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Якорь сетки (прозрачный) -->
  <rect width="32" height="32" fill="none"/>

  <!-- БАЗА: три точки клика — короткие горизонтальные штрихи -->
  <line x1="3" y1="27" x2="10" y2="27" stroke="#D9D9D9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="27" x2="29" y2="27" stroke="#D9D9D9" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="12.5" y1="10" x2="19.5" y2="10" stroke="#D9D9D9" stroke-width="1.5" stroke-linecap="round"/>

  <!-- БАЗА: маркеры отметки (треугольник + вертикальный штрих) -->
  <polygon points="6.5,20 10.5,27 2.5,27" fill="#D9D9D9" stroke="#666666" stroke-width="1" stroke-linejoin="round"/>
  <line x1="6.5" y1="20" x2="6.5" y2="15" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/>

  <polygon points="25.5,20 29.5,27 21.5,27" fill="#D9D9D9" stroke="#666666" stroke-width="1" stroke-linejoin="round"/>
  <line x1="25.5" y1="20" x2="25.5" y2="15" stroke="#666666" stroke-width="1.2" stroke-linecap="round"/>

  <!-- МОДИФИКАТОР: активная отметка по клику — главный акцент -->
  <polygon points="16,6 20,13 12,13" fill="#89CBFA"/>
  <line x1="16" y1="2.5" x2="16" y2="6" stroke="#89CBFA" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="16" cy="2.5" r="1.2" fill="#89CBFA"/>

  <!-- Процесс: точка вставки под активным маркером -->
  <line x1="16" y1="13" x2="16" y2="10" stroke="#89CBFA" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
</svg>
