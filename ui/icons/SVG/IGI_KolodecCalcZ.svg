<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Кольцо колодца (внешний контур) -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#666666" stroke-width="1.5"/>

  <!-- Решётка колодца — две перекладины -->
  <rect x="6" y="14.5" width="20" height="2" rx="1" fill="#D9D9D9" opacity="0.35"/>
  <rect x="15.5" y="6" width="2" height="20" rx="1" fill="#D9D9D9" opacity="0.35"/>

  <!-- Буква Z (отметка) — главный акцент -->
  <path d="M 8,10 L 19,10 L 8,21 L 19,21" fill="none" stroke="#89CBFA" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Маленькая стрелка расчёта (дельта по Z) — зелёный, процесс -->
  <line x1="24" y1="11" x2="24" y2="21" stroke="#82D99F" stroke-width="1.5" stroke-linecap="round"/>
  <polygon points="22,13 24,8 26,13" fill="#82D99F"/>
  <polygon points="22,18 24,23 26,18" fill="#82D99F"/>
</svg>