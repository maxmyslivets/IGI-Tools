<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Подпись номенклатур планшета">
  <title>IGI_SIGN_NOMENCLATURE — Подпись номенклатур планшета</title>
  <defs><mask id="cut-igi-sign-nomenclature" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><rect width="32" height="32" fill="#fff"/><circle cx="24" cy="24" r="7.6" fill="#000"/></mask></defs>
  <g mask="url(#cut-igi-sign-nomenclature)">
    <!-- Квадрат планшета 250×250 -->
    <rect x="3.5" y="3.5" width="25" height="25" rx="1" fill="none" stroke="#D9D9D9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Жёлтые метки по центру каждой стороны -->
    <line x1="13.5" y1="5" x2="18.5" y2="5" stroke="#FFD580" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="13.5" y1="27" x2="18.5" y2="27" stroke="#FFD580" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="5" y1="13.5" x2="5" y2="18.5" stroke="#FFD580" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="27" y1="13.5" x2="27" y2="18.5" stroke="#FFD580" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Центральный квадратик с номенклатурой (акцент) -->
    <rect x="12" y="12" width="8.5" height="8.5" rx="0.4" fill="#89CBFA"/><path d="M 13.9,15.2 L 18.9,15.2" fill="none" stroke="#666666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Текст-заполнитель внутри -->
    <path d="M 13.9,17.8 L 17.2,17.8" fill="none" stroke="#666666" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Глиф-модификатор: карандаш редактирования (цвет модификатора) -->
  <g transform="translate(24 24)">
    <path d="M -5.2,5.2 L -4.1,1.5 L 1.9,-4.5 L 4.7,-1.7 L -1.3,4.3 Z" fill="#FFD580"/>
  </g>
</svg>