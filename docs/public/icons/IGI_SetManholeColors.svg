<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Внешний корпус (круг) -->
  <circle cx="16" cy="16" r="15" fill="#5D6D7E" stroke="#34495E" stroke-width="1"/>
  <circle cx="16" cy="16" r="12" fill="#7F8C8D"/>
  <circle cx="16" cy="16" r="10" fill="none" stroke="#5D6D7E" stroke-width="0.5"/>

  <!-- Разноцветные сектора (углы и радиусы пропорционально уменьшены в 2 раза) -->
  <!-- Красный сектор -->
  <path d="M16 6 A10 10 0 0 1 26 16 L21 16 A5 5 0 0 0 16 11Z" fill="#EF4444"/>
  <!-- Зеленый сектор -->
  <path d="M26 16 A10 10 0 0 1 16 26 L16 21 A5 5 0 0 0 21 16Z" fill="#10B981"/>
  <!-- Фиолетовый сектор -->
  <path d="M16 26 A10 10 0 0 1 6 16 L11 16 A5 5 0 0 0 16 21Z" fill="#8B5CF6"/>
  <!-- Оранжевый сектор -->
  <path d="M6 16 A10 10 0 0 1 16 6 L16 11 A5 5 0 0 0 11 16Z" fill="#F59E0B"/>

  <!-- Центральная сердцевина -->
  <circle cx="16" cy="16" r="5" fill="#ECF0F1"/>

  <!-- Внешние крепежные ушки (упрощены для четкого попадания в пиксели 32х32) -->
  <rect x="12" y="1" width="8" height="3" rx="1" fill="#34495E"/>
  <rect x="12" y="1" width="8" height="3" rx="1" fill="#34495E" transform="rotate(90, 16, 16)"/>
</svg>
