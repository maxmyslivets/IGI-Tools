<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Базовая линия уровня (Z=0) — утолщена до 3px для баланса в размере 32х32 -->
  <line x1="2" y1="28" x2="30" y2="28" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>

  <!-- Буква Z — пропорционально увеличена, толщина линий 3px -->
  <path d="M 4,6 L 20,6 L 4,22 L 20,22" fill="none" stroke="#D9D9D9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Стрелка проекции Z — увеличена и выровнена по пикселям -->
  <line x1="26" y1="4" x2="26" y2="18" stroke="#89CBFA" stroke-width="2" stroke-linecap="round"/>
  <polygon points="22,16 26,22 30,16" fill="#89CBFA" stroke="#89CBFA" stroke-width="2" stroke-linejoin="round"/>
</svg>
