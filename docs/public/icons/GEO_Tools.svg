<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Прозрачная подложка для выравнивания -->
  <rect width="32" height="32" fill="none"/>

  <!-- ТОПОГРАФИЧЕСКИЙ ПЛАН (Слои / Изолинии рельефа) -->
  <!-- Внешняя горизонталь (Нейтральная) -->
  <path d="M 4 22 C 4 12, 12 4, 24 4 C 27 4, 29 6, 28 9 C 27 12, 28 18, 25 22 C 21 27, 12 28, 4 22 Z"
        fill="none" stroke="#808080" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="3 2"/>

  <!-- Внутренняя горизонталь (Контурная) -->
  <path d="M 8 20 C 8 14, 13 8, 20 8 C 23 8, 24 12, 21 15 C 18 18, 15 23, 8 20 Z"
        fill="none" stroke="#666666" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- СЕТКА КООРДИНАТ (Элементы автоматизации и AutoCAD) -->
  <!-- Относительные оси перекрестия -->
  <path d="M 3 16 H 29 M 16 3 V 29" stroke="#666666" stroke-width="0.75" stroke-opacity="0.4"/>
  <!-- Точки пересечения координатной сетки -->
  <circle cx="16" cy="7" r="1" fill="#808080"/>
  <circle cx="16" cy="25" r="1" fill="#808080"/>
  <circle cx="7" cy="16" r="1" fill="#808080"/>
  <circle cx="25" cy="16" r="1" fill="#808080"/>

  <!-- ГЛАВНЫЙ АКЦЕНТ: Геодезический маркер (Пин) в центре координат -->
  <!-- Внешний контур маркера -->
  <path d="M 16 7 C 11 7, 11 15, 16 21 C 21 15, 21 7, 16 7 Z"
        fill="#89CBFA" stroke="#666666" stroke-width="1" stroke-linejoin="round"/>

  <!-- Внутреннее ядро (Действие / Процесс) -->
  <circle cx="16" cy="12" r="2.5" fill="#82D99F" stroke="#666666" stroke-width="0.75"/>

  <!-- МОДИФИКАТОР: Точка точного наведения (Инструменты / AutoCAD) -->
  <circle cx="16" cy="12" r="0.75" fill="#FFD580"/>
</svg>
